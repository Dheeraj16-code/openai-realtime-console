<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Talk to Dheeraj's Voice Bot</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:640px;margin:0 auto;padding:20px;background:#f5f6fa}
  h1{font-size:1.4rem} #log{background:#fff;border-radius:12px;padding:12px;height:340px;overflow:auto}
  .me{color:#0b5;margin:8px 0}.bot{color:#222;margin:8px 0}
  #mic{width:100%;padding:16px;font-size:1.1rem;border:0;border-radius:12px;background:#4f46e5;color:#fff;cursor:pointer;margin-top:12px}
  #mic.on{background:#dc2626}
  .row{display:flex;gap:8px;margin-top:10px} input{flex:1;padding:10px;border-radius:8px;border:1px solid #ccc}
  .row button{padding:10px 16px;border-radius:8px;border:0;background:#222;color:#fff}
  small{color:#666}
</style>
</head>
<body>
<h1>🎙️ Hi, I'm Dheeraj. Ask me anything.</h1>
<small>Click the mic and speak (use Chrome). Or type below.</small>
<div id="log"></div>
<button id="mic">🎤 Tap to Speak</button>
<div class="row"><input id="txt" placeholder="Or type your question…" /><button id="send">Send</button></div>

<script>
const log = document.getElementById("log"), mic = document.getElementById("mic");
const txt = document.getElementById("txt");
let history = [];

function add(cls, t){ const d=document.createElement("div"); d.className=cls; d.textContent=(cls==="me"?"You: ":"Dheeraj: ")+t; log.appendChild(d); log.scrollTop=log.scrollHeight; }

function speak(t){
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang="en-IN"; u.rate=1;
  speechSynthesis.speak(u);
}

async function ask(q){
  add("me", q); history.push({role:"user",content:q});
  const r = await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history})});
  const {reply} = await r.json();
  history.push({role:"assistant",content:reply}); add("bot", reply); speak(reply);
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(!SR){ mic.textContent="Voice not supported here: please use Chrome or type below"; mic.disabled=true; }
else{
  const rec = new SR(); rec.lang="en-IN"; rec.interimResults=false;
  rec.onstart=()=>{mic.classList.add("on");mic.textContent="🔴 Listening…"};
  rec.onend=()=>{mic.classList.remove("on");mic.textContent="🎤 Tap to Speak"};
  rec.onresult=e=>ask(e.results[0][0].transcript);
  mic.onclick=()=>{speechSynthesis.cancel();rec.start()};
}
document.getElementById("send").onclick=()=>{ if(txt.value.trim()){ask(txt.value.trim());txt.value="";} };
txt.addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("send").click()});
</script>
</body>
</html>
